name: Run Titan Now

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "sector"
        type: choice
        options:
          - sector
          - all_sectors
          - live
          - custom
          - portfolio
      sector_id:
        description: "Sector id (used when mode=sector)"
        required: false
        default: "defence"
      max_symbols:
        description: "Optional max symbols cap (sector mode)"
        required: false
        default: ""
      workers:
        description: "Optional sector workers"
        required: false
        default: "4"
      all_sector_workers:
        description: "Sector parallelism for all_sectors (1=serial, recommended for free-tier Gemini)"
        required: false
        default: "1"
      custom_symbols:
        description: "Custom symbols list (comma/space/newline separated, used when mode=custom)"
        required: false
        default: ""
      custom_exchange:
        description: "Exchange code for custom symbols (NSE or BSE, used when mode=custom)"
        required: false
        default: "NSE"
      portfolio_holdings_json:
        description: "Portfolio holdings payload JSON (used when mode=portfolio)"
        required: false
        default: ""
      portfolio_max_positions:
        description: "Max holdings to evaluate for mode=portfolio"
        required: false
        default: "75"
      titan_scope:
        description: "full = entire sector universe | priority = top names from last weekend refresh"
        required: false
        default: "priority"
        type: choice
        options:
          - full
          - priority
      priority_top_n:
        description: "Top N symbols when titan_scope=priority (empty = 10 for sector, 5 for all_sectors)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Without this, a hung Breeze/SMTP/Gemini call can sit until the hosted runner default (~6h).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load Breeze token from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/inject_breeze_session_from_supabase.py

      - name: Run Titan
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Must be service_role (not anon) unless sql/grant_llm_digest_memory.sql was applied.
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_SECRET: ${{ secrets.BREEZE_SECRET }}
          # Must be "1" for sector/custom digests to persist into public.llm_digest_memory (mobile insights UI).
          TITAN_ENABLE_ANALYSIS_STORE: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MIN_CALL_INTERVAL_SECONDS: "45"
          GEMINI_SECTOR_DIGEST_FAIL_OPEN: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          GH_INPUT_PORTFOLIO_JSON: ${{ inputs.portfolio_holdings_json }}
        run: |
          SCOPE="${{ inputs.titan_scope }}"
          if [ -z "$SCOPE" ]; then SCOPE="priority"; fi

          if [ "${{ inputs.mode }}" = "live" ]; then
            python main.py --live
          elif [ "${{ inputs.mode }}" = "portfolio" ]; then
            ARGS="--custom-exchange ${{ inputs.custom_exchange }}"
            if [ -n "${{ inputs.portfolio_max_positions }}" ]; then
              ARGS="$ARGS --portfolio-max-positions ${{ inputs.portfolio_max_positions }}"
            fi
            python main.py $ARGS --portfolio-holdings-json "$GH_INPUT_PORTFOLIO_JSON"
          elif [ "${{ inputs.mode }}" = "custom" ]; then
            ARGS="--sector ${{ inputs.sector_id }} --custom-exchange ${{ inputs.custom_exchange }} --sector-digest"
            if [ -n "${{ inputs.max_symbols }}" ]; then
              ARGS="$ARGS --sector-max-symbols ${{ inputs.max_symbols }}"
            fi
            if [ -n "${{ inputs.workers }}" ]; then
              ARGS="$ARGS --sector-workers ${{ inputs.workers }}"
            fi
            python main.py $ARGS --custom-symbols "${{ inputs.custom_symbols }}"
          elif [ "${{ inputs.mode }}" = "all_sectors" ]; then
            ARGS="--all-sectors --exclude-sectors unknown,non_equity"
            if [ "$SCOPE" = "priority" ]; then
              TOPN="${{ inputs.priority_top_n }}"
              if [ -z "$TOPN" ]; then TOPN=5; fi
              ARGS="$ARGS --sector-priority-only --sector-priority-top-n $TOPN"
            fi
            if [ -n "${{ inputs.max_symbols }}" ]; then
              ARGS="$ARGS --sector-max-symbols ${{ inputs.max_symbols }}"
            fi
            if [ -n "${{ inputs.workers }}" ]; then
              ARGS="$ARGS --sector-workers ${{ inputs.workers }}"
            fi
            if [ -n "${{ inputs.all_sector_workers }}" ]; then
              ARGS="$ARGS --all-sector-workers ${{ inputs.all_sector_workers }}"
            fi
            python main.py $ARGS
          else
            if [ "$SCOPE" = "priority" ]; then
              TOPN="${{ inputs.priority_top_n }}"
              if [ -z "$TOPN" ]; then TOPN=10; fi
              ARGS="--sector ${{ inputs.sector_id }} --sector-priority-only --sector-priority-top-n $TOPN --sector-digest"
            else
              ARGS="--sector ${{ inputs.sector_id }} --sector-digest"
            fi
            if [ -n "${{ inputs.max_symbols }}" ]; then
              ARGS="$ARGS --sector-max-symbols ${{ inputs.max_symbols }}"
            fi
            if [ -n "${{ inputs.workers }}" ]; then
              ARGS="$ARGS --sector-workers ${{ inputs.workers }}"
            fi
            python main.py $ARGS
          fi

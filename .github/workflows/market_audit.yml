# Private repo recommended. ICICI Breeze session tokens expire quickly—if this runs often,
# refresh BREEZE_SESSION_TOKEN (GitHub secret / Supabase) whenever the API returns "session expired".
#
# Repository secrets: SUPABASE_URL, SUPABASE_KEY (service role: read session_config + write audit_logs),
#   BREEZE_API_KEY, BREEZE_SECRET, GEMINI_API_KEY
# Recommended: BREEZE_SESSION_TOKEN — daily Breeze token; if set, bash writes GITHUB_ENV (no Supabase read).
# Optional email: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, EMAIL_FROM, EMAIL_TO, SMTP_USE_TLS
#
# If the repo root is not the Titan folder, set defaults.run.working-directory below (e.g. Titan).

name: Market audit (Titan V12.0)

on:
  workflow_dispatch:
  schedule:
    # NSE cash session window in IST, converted to UTC (GitHub schedule is always UTC).
    # Weekday field is UTC: Mon–Fri = 1–5 in UTC (early IST Monday before ~05:30 IST is still Sunday UTC).
    # :15 past each hour IST → :45 UTC; 11:00 IST = 05:30 UTC; 11:15 IST = 05:45 UTC; 15:30 IST = 10:00 UTC.
    - cron: "45 3 * * 1-5"
    - cron: "45 4 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prefer env-based secret so bash sees the token reliably; then Python only if empty.
      - name: Load Breeze session token (secret or Supabase)
        env:
          BREEZE_SESSION_TOKEN: ${{ secrets.BREEZE_SESSION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          if [ -n "${BREEZE_SESSION_TOKEN:-}" ]; then
            d=$(openssl rand -hex 16)
            {
              echo "BREEZE_SESSION_TOKEN<<$d"
              echo "$BREEZE_SESSION_TOKEN"
              echo "$d"
            } >> "$GITHUB_ENV"
            echo "Loaded BREEZE_SESSION_TOKEN from repository secret."
          else
            python scripts/inject_breeze_session_from_supabase.py
          fi

      - name: Live market audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_SECRET: ${{ secrets.BREEZE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: python main.py --live

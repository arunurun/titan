# Private repo recommended. ICICI Breeze session tokens expire quickly—if this runs often,
# refresh BREEZE_SESSION_TOKEN (GitHub secret / Supabase) whenever the API returns "session expired".
#
# Repository secrets: SUPABASE_URL, SUPABASE_KEY (service role: read session_config + write audit_logs),
#   BREEZE_API_KEY, BREEZE_SECRET, GEMINI_API_KEY
# Recommended: BREEZE_SESSION_TOKEN — daily Breeze token; if set, bash writes GITHUB_ENV (no Supabase read).
#
# If the repo root is not the Titan folder, set defaults.run.working-directory below (e.g. Titan).

name: Market audit (Titan V12.0)

on:
  workflow_dispatch:
  schedule:
    # Every hour at :00 UTC. GitHub may start a few minutes late.
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prefer env-based secret so bash sees the token reliably; then Python only if empty.
      - name: Load Breeze session token (secret or Supabase)
        env:
          BREEZE_SESSION_TOKEN: ${{ secrets.BREEZE_SESSION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          if [ -n "${BREEZE_SESSION_TOKEN:-}" ]; then
            d=$(openssl rand -hex 16)
            {
              echo "BREEZE_SESSION_TOKEN<<$d"
              echo "$BREEZE_SESSION_TOKEN"
              echo "$d"
            } >> "$GITHUB_ENV"
            echo "Loaded BREEZE_SESSION_TOKEN from repository secret."
          else
            python scripts/inject_breeze_session_from_supabase.py
          fi

      - name: Live market audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_SECRET: ${{ secrets.BREEZE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --live

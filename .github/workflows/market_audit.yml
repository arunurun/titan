# DEPRECATED — use "Run Titan Now" (run_titan_now.yml) instead.
# Scheduled weekday market runs (06:30 IST) live in run_titan_now.yml.
# This wrapper remains for one release so existing bookmarks still work.

name: Market audit (deprecated — use Run Titan Now)

on:
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/run_titan_now.yml
    secrets: inherit
    with:
      mode: all_sectors
      titan_scope: full
      workers: "4"
      all_sector_workers: "1"
      refresh_global_news: false
      prefetch_symbol_news: false

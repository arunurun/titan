# Private repo recommended. Paste the daily Breeze session token into Supabase `session_config`
# (Table Editor → row id=1 → breeze_session_token) before ~09:15 IST, or use workflow_dispatch after pasting.
#
# Repository secrets: SUPABASE_URL, SUPABASE_KEY (service role: can read session_config + write audit_logs),
#   BREEZE_API_KEY, BREEZE_SECRET, GEMINI_API_KEY
#
# If the repo root is not the Titan folder, set defaults.run.working-directory below (e.g. Titan).

name: Market audit (Titan V12.0)

on:
  workflow_dispatch:
  schedule:
    # 09:15 IST = 03:45 UTC; 11:30 IST = 06:00 UTC (weekdays, India no DST)
    - cron: "45 3 * * 1-5"
    - cron: "0 6 * * 1-5"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load Breeze session token from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/inject_breeze_session_from_supabase.py

      - name: Live market audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_SECRET: ${{ secrets.BREEZE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --live

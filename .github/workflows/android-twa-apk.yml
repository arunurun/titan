name: Build TWA debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android
    paths:
      - "android/twa/**"
      - ".github/workflows/android-twa-apk.yml"
  pull_request:
    branches:
      - android
      - main
    paths:
      - "android/twa/**"
      - ".github/workflows/android-twa-apk.yml"

# Do not cancel in-progress runs: a second push was aborting Gradle mid-build
# with "The operation was canceled." New runs queue until the current one finishes.
concurrency:
  group: android-twa-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/twa/**/*.gradle*', 'android/twa/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android/twa
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-twa-debug-apk
          path: android/twa/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

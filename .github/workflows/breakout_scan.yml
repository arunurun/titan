name: Breakout scan

# Run ingest_breakout_ohlcv workflow (or scripts/ingest_breakout_ohlcv.py) before scan
# so equity_ohlcv_daily is warm; scanner falls back to Yahoo on cache miss.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breakout_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run small & micro-cap breakout scanner
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: python -m src.breakout_scanner

      - name: Upload breakout report and log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakout-scan-${{ github.run_number }}
          path: |
            output/breakouts/daily_breakout_report_v2.md
            output/breakouts/breakout_scanner_run.log
          if-no-files-found: warn
